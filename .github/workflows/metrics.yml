name: Metrics
on:
  schedule: [{cron: "0 * * * *"}]  # updates every hour
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Output
          filename: github-metrics.svg
          base: header, repositories, activity, community, metadata

          # Appearance
          config_timezone: Asia/Kolkata
          config_presets: "large"
          plugin_nightscout: no

          # Plugins (ALL enabled)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_ignored: html, css, tex
          plugin_languages_details: percentage
          plugin_languages_limit: 10

          plugin_followup: yes
          plugin_followup_indepth: yes

          plugin_stars: yes
          plugin_stars_limit: 12

          plugin_repositories: yes
          plugin_repositories_affiliations: "owner, collaborator"

          plugin_contributors: yes

          plugin_traffic: yes

          plugin_achievements: yes
          plugin_achievements_threshold: B

          plugin_gists: yes

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes

          plugin_calendar: yes

          plugin_lines: yes

          plugin_topics: yes
          plugin_topics_limit: 25
          plugin_topics_mode: icons

          plugin_projects: yes

          plugin_notable: yes
