name: Metrics

on:
  # Safety net only -- pushes below do the real refreshing. Kept so the
  # card still updates on days with no pushes (contributions elsewhere,
  # streak rollover). The original hourly cron burned ~24x the Actions
  # minutes for no gain.
  schedule: [{ cron: "0 4 * * *" }]
  workflow_dispatch:

  # Regenerate on every push to main so the card reflects new commits
  # instead of waiting for the next cron.
  #
  # paths-ignore is load-bearing, not tidiness. These workflows commit their
  # own output back to main, and the metrics action's message is
  # "Update github-metrics.svg - [Skip GitHub Action]" -- which is NOT one of
  # GitHub's recognised skip tokens ([skip ci], [ci skip], [no ci],
  # [skip actions], [actions skip]). Without this list, that commit retriggers
  # the workflow and it loops forever. Ignoring the generated artifacts means
  # a push that only touches them is skipped.
  push:
    branches: [main]
    paths-ignore:
      - 'github-metrics.svg'
      - 'assets/trophy.svg'

permissions:
  contents: write

# Only one run at a time. Two overlapping runs would both try to commit the
# regenerated artifact to main and one would fail to push.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Picks the token at runtime, so this workflow is correct whether or not
      # METRICS_TOKEN has been swapped yet and upgrades itself the moment it
      # is -- no second edit required.
      #
      #   ghp_*         classic PAT   -> full card, private contributions in
      #   github_pat_*  fine-grained  -> rejected by the action, fall back
      #   unset / other               -> fall back to GITHUB_TOKEN
      #
      # Only a boolean reaches the output. The token value is never echoed.
      - name: Choose token
        id: tok
        env:
          MT: ${{ secrets.METRICS_TOKEN }}
        run: |
          case "$MT" in
            ghp_*)
              echo "classic=true" >> "$GITHUB_OUTPUT"
              echo "METRICS_TOKEN is a classic PAT -- full card."
              ;;
            github_pat_*)
              echo "classic=false" >> "$GITHUB_OUTPUT"
              echo "::warning::METRICS_TOKEN is a FINE-GRAINED PAT, which lowlighter/metrics rejects outright. Falling back to GITHUB_TOKEN; the card will show PUBLIC contributions only. Replace it with a classic PAT carrying full 'repo' scope."
              ;;
            "")
              echo "classic=false" >> "$GITHUB_OUTPUT"
              echo "::warning::METRICS_TOKEN is unset -- using GITHUB_TOKEN. Public contributions only."
              ;;
            *)
              echo "classic=false" >> "$GITHUB_OUTPUT"
              echo "::warning::METRICS_TOKEN does not look like a classic PAT (expected a ghp_ prefix) -- using GITHUB_TOKEN. Public contributions only."
              ;;
          esac

      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          # The classic PAT needs full `repo` scope, NOT `public_repo`.
          # `public_repo` clears the fine-grained rejection but still cannot
          # read private repositories, and 970 of 1,339 contributions on this
          # account are private -- so the card would still undercount by ~72%
          # and keep disagreeing with the profile page.
          token: ${{ steps.tok.outputs.classic == 'true' && secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          # Output -- README.md embeds this file in the "Hunter's Journal" section.
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
          config_display: large
          config_octicon: yes

          # Everything below is gated on the token actually being classic.
          # Under the repo-scoped GITHUB_TOKEN these render "1 Repository /
          # 0 Languages" or "Unexpected error", which is worse than omitting
          # them -- verified by running the workflow and reading the SVG.
          base: ${{ steps.tok.outputs.classic == 'true' && 'header, repositories, metadata' || 'header, metadata' }}

          # Correct under either token.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: ${{ steps.tok.outputs.classic == 'true' && 'yes' || 'no' }}
          plugin_languages_ignored: html, css, tex, scss
          plugin_languages_details: percentage
          plugin_languages_limit: 10

          plugin_habits: ${{ steps.tok.outputs.classic == 'true' && 'yes' || 'no' }}
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_achievements: ${{ steps.tok.outputs.classic == 'true' && 'yes' || 'no' }}
          plugin_achievements_threshold: B

          plugin_topics: ${{ steps.tok.outputs.classic == 'true' && 'yes' || 'no' }}
          plugin_topics_limit: 20
          plugin_topics_mode: icons

          plugin_stars: ${{ steps.tok.outputs.classic == 'true' && 'yes' || 'no' }}
          plugin_stars_limit: 6

          # The generated SVG is hard light-mode -- it ships no
          # prefers-color-scheme block, and its calendar cells carry a literal
          # fill="#ebedf0". On GitHub's dark theme that renders as a white
          # slab, the same failure that made ghchart.rshah.org unusable.
          #
          # CSS beats SVG presentation attributes, so attribute selectors can
          # remap the cells without post-processing the file. Colours are the
          # README's Hallownest palette, and the contribution scale mirrors the
          # snake's ramp so the two graphs read as one system.
          extras_css: |
            /* :root is the outermost svg only. A bare `svg` selector also
               matches the nested <svg> used for icons and the calendar,
               which painted an opaque panel over the commit-streak text. */
            :root { background: #0A0A0A; }
            svg svg { background: transparent; }
            h1, h2, h3 { color: #E0752D !important; }
            .field, text, tspan { color: #F0EDE5; }
            .field svg { fill: #8FB8C9 !important; }
            .day { outline-color: rgba(240,237,229,.07) !important; }
            [fill="#ebedf0"] { fill: #151515; }
            [fill="#9be9a8"] { fill: #4a2a14; }
            [fill="#40c463"] { fill: #8a4a1c; }
            [fill="#30a14e"] { fill: #c26426; }
            [fill="#216e39"] { fill: #E0752D; }
