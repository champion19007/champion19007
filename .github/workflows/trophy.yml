name: Generate Trophies

# Renders ryo-ma/github-profile-trophy into assets/trophy.svg and commits it.
#
# Why generate it here instead of using the hosted image URL from that
# project's README (https://github-profile-trophy.vercel.app/?username=...):
# that deployment is switched off and returns "402 Payment Required /
# DEPLOYMENT_DISABLED" for every user, including ryo-ma's own username.
# Generating in CI removes the third-party uptime dependency entirely --
# the README points at a file in this repo, so it cannot break again.
#
# Pinned to a master commit rather than the v1.0 tag: v1.0 is the commit
# that first added the Action (Jan 2026) and predates the Deno 2.x import
# fix (#448) and the GraphQL star-failure fix (#454) from July 2026.
#
# assets/trophy.svg is committed, so the README renders immediately on
# merge. Running this manually (Actions -> Generate Trophies -> Run
# workflow) is optional -- it just refreshes the counts ahead of the cron.

on:
  schedule: [{ cron: "30 4 * * *" }]
  workflow_dispatch:

jobs:
  trophy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Render trophy SVG
        uses: ryo-ma/github-profile-trophy@e3c89df995e92e67cdd4b2acaab9d974583dc1f7
        with:
          username: ${{ github.repository_owner }}
          output_path: assets/trophy.svg
          # Starting point only -- the recolor step below maps whatever
          # this emits onto the README palette, so the theme choice just
          # needs to be dark. gruvbox is closest going in (burnt orange
          # #d65d0e, bone #ebdbb2), which keeps the remap table small.
          # Changing this means updating PALETTE in the recolor script.
          theme: gruvbox
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recolor and drop empty trophies
        # The Action exposes only `theme` -- no custom hex, and no `rank`
        # filter (that is a query param of the hosted service, not the
        # Action). So the palette remap and the removal of "Unknown / 0pt"
        # cards both happen after rendering. See the script for details.
        run: python3 .github/scripts/trophy_postprocess.py assets/trophy.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophy.svg
          # --cached covers the new-file case too; plain `git diff` would
          # report no change for a file that is not yet tracked.
          if git diff --cached --quiet -- assets/trophy.svg; then
            echo "Trophies unchanged; nothing to commit."
          else
            git commit -m "chore: refresh trophy SVG [skip ci]"
            git push
          fi
