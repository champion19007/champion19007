name: Generate Snake

# Renders the contribution grid as an animated snake in the Hallownest palette
# and pushes it to the `output` branch, which README.md links to.
#
# This replaced ghchart.rshah.org, whose empty cells are hard-coded #EEEEEE
# with no override -- a glaring white grid on GitHub's dark theme.
#
# Uses the built-in GITHUB_TOKEN, so unlike metrics.yml it needs no PAT.
# Run it once manually (Actions tab -> Generate Snake -> Run workflow) after
# the first push, otherwise the README image 404s until the daily cron fires.

on:
  schedule: [{ cron: "0 4 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Infection-orange snake crawling over a void-black grid.
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#E0752D&color_dots=#151515,#4a2a14,#8a4a1c,#c26426,#E0752D

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
